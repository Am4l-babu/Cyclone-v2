; ============================================================
;  Cyclone Target Lock - PlatformIO project (VS Code)
;
;  Build / upload the game:      pio run -e game -t upload
;  Run a hardware test:          pio run -e test_button -t upload
;                                pio run -e test_led    -t upload
;                                pio run -e test_oled   -t upload
;                                pio run -e test_buzzer -t upload
;  Serial monitor:               pio device monitor
; ============================================================

[platformio]
default_envs = game

; ---------- shared by every environment ----------
[env]
platform      = espressif8266
board         = nodemcuv2
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600

; ---------- the game (src/main.cpp) ----------
[env:game]
build_src_filter = +<*> -<hardware_tests/>
lib_deps =
    fastled/FastLED@^3.7.0
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit SSD1306@^2.5.9

; ---------- hardware tests (hardware_tests/*) ----------
[env:test_button]
build_src_filter = -<*> +<hardware_tests/test_button.cpp>

[env:test_led]
build_src_filter = -<*> +<hardware_tests/test_led.cpp>
lib_deps =
    fastled/FastLED@^3.7.0

[env:test_oled]
build_src_filter = -<*> +<hardware_tests/test_oled.cpp>
lib_deps =
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit SSD1306@^2.5.9

[env:test_buzzer]
build_src_filter = -<*> +<hardware_tests/test_buzzer.cpp>
